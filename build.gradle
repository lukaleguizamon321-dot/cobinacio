plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'Cobinatio'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = "Iron's Maven - Release"
        url = "https://code.redspace.io/releases"
    }
    maven { url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/" }
    maven { url = "https://maven.theillusivec4.top" }
    maven { url = "https://maven.kosmx.dev/" }
}

// Busca la primera version de Iron's Spells que se pueda bajar. Para compilar da igual
// una 3.16.x u otra; en el juego se usa la que tengas instalada (la 3.16.3).
def pickVersion = { String coordinates, List<String> versions ->
    for (String v : versions) {
        try {
            def cfg = configurations.detachedConfiguration(dependencies.create("${coordinates}:${v}"))
            cfg.transitive = false
            cfg.resolve()
            logger.lifecycle("Usando ${coordinates}:${v}")
            return v
        } catch (Exception e) {
            logger.lifecycle("No pude bajar ${coordinates}:${v}, pruebo con otra version...")
        }
    }
    return versions[0]
}

def ironsVersion = pickVersion('io.redspace:irons_spellbooks',
        ['1.20.1-3.16.3', '1.20.1-3.16.2', '1.20.1-3.16.0', '1.20.1-3.15.4'])

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Iron's Spells 'n Spellbooks y las librerias que usa (solo para compilar; en el juego
    // se usan las que ya tenes instaladas). Mutant Monsters y Mutant More NO hacen falta
    // para compilar: el mod los usa por su nombre en tiempo de ejecucion.
    implementation fg.deobf("io.redspace:irons_spellbooks:${ironsVersion}")
    implementation fg.deobf("io.redspace:irons_lib:${irons_lib_version}")
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${geckolib_version}")
    implementation fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")
    implementation fg.deobf("dev.kosmx.player-anim:player-animation-lib-forge:${player_animator_version}")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
