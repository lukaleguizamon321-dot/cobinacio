mod_description=Cobinatio combina hechizos de Iron's Spells 'n Spellbooks con mobs de otros mods. Revive Mutantes (X), (Y) y (Z): Revivir Muertos que invoca mutantes de Mutant Monsters. Enraizar Plantas (1 a 4): Enraizar que invoca plantas Foliaath de Mowzie's Mobs que muerden al objetivo inmovilizado. Cangrejos de hierro, oro, cobre, carbón, lapislázuli, amatista, redstone, diamante y esmeralda con pasivas propias, efectos nuevos y una pestaña de logros. Hechizos Invocar Cangrejo (carbón, cobre, hierro), Cabeza de Creeper Mutante e Invocar Blaze (con versiones mutantes). Guaridas subterráneas con una sala central, un pedestal y un nido por cada cangrejo. Artefacto Doble Almacén (amuleto de Curios): agranda el inventario con 27 espacios extra. Jefe Cangrejo Titán de Carbón (con su modelo propio): duerme como un huevo en el centro de las guaridas (grandes), suelta un huevo que se pule en la piedra de afilar y se incuba sobre un bloque de carbón para criar un cangrejo aliado. La mascota de carbón puede llevar un horno encima que cocina sin combustible. Jefe Cangrejo Titán de Cobre con su propia guarida: tira rayos de colores (violeta electrocuta, amarillo paraliza, rojo pega más, azul anula el maná, verde lo cura), embiste, y suelta un huevo que incuba sobre un bloque de cobre. Con música propia. La mascota de cobre puede llevar un pararrayos y rotar entre rayo verde (cura al dueño y a las mascotas), violeta (electrocuta) y amarillo (paraliza). Jefe Cangrejo Titán de Amatista en una guarida ovalada con forma de geoda gigante: láser lento, línea de pinchos de cristal y un ataque desde el centro (láser giratorio o lluvia de amatistas); no embiste y rompe bloques si le tapan el camino; suelta un huevo que incuba sobre un bloque de amatista. Los jefes de cobre y de amatista tienen su propia música. La mascota de amatista hace crecer fragmentos de amatista. Las mascotas de los huevos se pueden sentar.
