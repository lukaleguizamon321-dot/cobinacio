mod_description=Cobinatio combina hechizos de Iron's Spells 'n Spellbooks con mobs de otros mods. Revive Mutantes (X), (Y) y (Z): Revivir Muertos que invoca mutantes de Mutant Monsters. Enraizar Plantas (1 a 4): Enraizar que invoca plantas Foliaath de Mowzie's Mobs que muerden al objetivo inmovilizado. Cangrejos de hierro, oro, cobre, carbón, lapislázuli, amatista, redstone, diamante y esmeralda con pasivas propias, efectos nuevos y una pestaña de logros. Hechizos Invocar Cangrejo (carbón, cobre, hierro), Cabeza de Creeper Mutante e Invocar Blaze (con versiones mutantes). Guaridas subterráneas con una sala central, un pedestal y un nido por cada cangrejo. Artefacto Doble Almacén (amuleto de Curios): agranda el inventario con 27 espacios extra. Jefe Cangrejo Titán de Carbón: duerme como un huevo en el centro de las guaridas.
